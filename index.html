<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sagufa Saman!</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-400 flex items-center justify-center p-4 overflow-hidden relative">

  <div id="balloons" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

  <div class="relative z-10 bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl p-8 md:p-12 max-w-2xl w-full text-center border border-white/50">
    <div class="text-6xl mb-4">🎂</div>
    <h1 class="text-4xl md:text-6xl font-bold bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent mb-2">
      Happy Birthday!
    </h1>
    <p class="text-2xl md:text-3xl font-semibold text-gray-800 mb-1">Sagufa Saman</p>
    <p class="text-lg md:text-xl text-gray-600 mb-6">May your day be filled with joy, laughter & lots of cake! 🎉</p>

    <div class="flex justify-center gap-2 mb-6 text-4xl" id="emoji-row">
      <span>🎈</span><span>🎉</span><span>🎁</span><span>🎊</span><span>✨</span>
    </div>

    <button onclick="blowCandle()" class="bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg transition-all duration-200 hover:scale-105 active:scale-95">
      🕯️ Blow the Candle!
    </button>

    <p id="wish" class="mt-6 text-lg text-gray-700 min-h-[3rem] transition-all duration-500"></p>
  </div>

  <script>
    const wishes = [
      "Happy Birthday Sagufa Saman! 🎂✨",
      "Wishing you the happiest birthday ever! 🥳🎉",
      "May all your dreams come true! 🌟💫",
      "Stay blessed and keep smiling! 😊🎈",
      "Another year, another adventure! 🚀🎁",
      "You're amazing — never forget that! ❤️🎊",
    ];

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function blowCandle() {
      const wishEl = document.getElementById('wish');
      wishEl.textContent = '🎵 Happy Birthday to Youu... 🎵';
      wishEl.classList.add('scale-110');
      setTimeout(() => wishEl.classList.remove('scale-110'), 300);

      const shuffled = shuffleArray([...wishes]);
      let i = 0;
      const interval = setInterval(() => {
        if (i >= shuffled.length) { clearInterval(interval); return; }
        wishEl.textContent = shuffled[i];
        wishEl.classList.add('scale-110');
        setTimeout(() => wishEl.classList.remove('scale-110'), 200);
        i++;
      }, 1200);
    }

    // Floating balloons
    function createBalloon() {
      const container = document.getElementById('balloons');
      const balloon = document.createElement('div');
      balloon.className = 'absolute text-4xl opacity-70';
      const emojis = ['🎈', '🎉', '🌟', '💖', '✨', '🎊', '⭐'];
      balloon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      balloon.style.left = Math.random() * 100 + '%';
      balloon.style.top = '105%';
      balloon.style.fontSize = (2 + Math.random() * 2) + 'rem';
      balloon.style.animationDuration = (6 + Math.random() * 4) + 's';
      balloon.style.animation = `float ${5 + Math.random() * 5}s linear forwards`;
      container.appendChild(balloon);
      setTimeout(() => balloon.remove(), 10000);
    }

    function injectFloatKeyframes() {
      const style = document.createElement('style');
      style.textContent = `
        @keyframes float {
          0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
          50% { opacity: 1; }
          100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    injectFloatKeyframes();
    setInterval(createBalloon, 800);
    for (let i = 0; i < 5; i++) setTimeout(createBalloon, i * 200);
  </script>
</body>
</html>
